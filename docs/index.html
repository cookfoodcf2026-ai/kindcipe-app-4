<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindcipe</title>
  <style>
    :root { --cream: #FAF8F5; --navy: #013E77; --copper: #F5A823; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      padding: 24px;
    }
    .card { max-width: 520px; width: 100%; text-align: center; }
    h1 { font-size: 34px; margin: 0 0 8px; letter-spacing: -0.5px; }
    p.tag { color: #6B7280; margin: 0 0 32px; font-size: 16px; line-height: 1.6; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      background: #fff;
      color: var(--navy);
      border: 1px solid #E5E7EB;
    }
    a.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .dot { color: var(--copper); }
    footer { margin-top: 32px; font-size: 13px; color: #9CA3AF; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kindcipe<span class="dot">.</span></h1>
    <p class="tag">今晚食咩？一鍵配好三餸一湯，家人溝通零時差。</p>
    <div class="links">
      <a class="btn primary" href="privacy/">私隱政策 · Privacy Policy</a>
      <a class="btn" href="mailto:support@kindcipe.com">聯絡我們 · Contact Support</a>
    </div>
    <footer>© 2026 Kindcipe. All rights reserved.</footer>
  </div>
</body>
</html>
